version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roshe-studio-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: roshe
      POSTGRES_PASSWORD: roshe_dev_password
      POSTGRES_DB: roshe_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roshe']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
